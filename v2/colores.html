<script>

(() => {
  const links = [...document.querySelectorAll('.toolbar .tabs a')];
  const byId = new Map(links.map((a) => [a.getAttribute('href').slice(1), a]));
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (!e.isIntersecting) return;
      links.forEach((a) => a.classList.remove('on'));
      const a = byId.get(e.target.id);
      if (a) { a.classList.add('on'); const t = a.parentElement; t.scrollTo({ left: a.offsetLeft - t.clientWidth / 2 + a.offsetWidth / 2, behavior: 'smooth' }); }
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  document.querySelectorAll('.page').forEach((p) => io.observe(p));
})();

// Alinea la leyenda a la derecha de la barra, como en el modelo.
document.fonts.ready.then(() => {
  document.querySelectorAll('.legend').forEach((lg) => {
    let right = 1117.45;
    [...lg.querySelectorAll('.li')].reverse().forEach((li) => {
      const t = li.querySelector('.lg');
      const x = right - (t.getComputedTextLength() + Number(t.getAttribute('x')));
      li.setAttribute('transform', 'translate(' + x + ',0)');
      right = x - 15.8;
    });
  });
});
</script>
